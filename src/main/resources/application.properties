spring.application.name=gestion-ganado

# Forzar codificación y desactivar inicializaciones extra
spring.datasource.sql-script-encoding=UTF-8
spring.session.store-type=none

# Conexión principal
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5434/gestion_ganado?sslmode=disable
spring.datasource.username=${MY_DB_USER}
spring.datasource.password=${MY_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true